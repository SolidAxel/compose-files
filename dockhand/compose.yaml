services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    networks:
      - caddy
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/axel/Docker/dockhand/dockhand_data:/app/data
      - /home/axel:/home/axel
    labels:
      caddy: dh.lab.axelegarcia.com
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls.dns: cloudflare ${CF_API_TOKEN}

volumes:
  dockhand_data:

networks:
  caddy:
    external: true
